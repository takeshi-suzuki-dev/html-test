<html lang="ja">
<head>

<title>Software Engineer Active English | 実務英文・間隔反復</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--paper:#fff;--ink:#182938;--muted:#5f7180;--line:#dce3ea;--blue:#17476b;--blue-soft:#edf4fa;--green:#1c6848;--green-soft:#eaf6ee;--amber:#955a14;--amber-soft:#fff5e6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;margin:0}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #7ca9cc;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
.container{max-width:950px;margin:0 auto;padding:22px 18px 72px}.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--blue)}h1{font-size:clamp(24px,4vw,32px);line-height:1.2;letter-spacing:-.03em;margin:5px 0 9px}.segment button,.day-nav button{border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:white;color:var(--ink)}.segment button.active{background:var(--blue);color:white;border-color:var(--blue)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.space{justify-content:space-between}.daytitle{font-size:23px;font-weight:750}.day-nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0}.day-nav label{font-size:13px;font-weight:650}.day-nav select{border:1px solid #c3ccd5;border-radius:8px;background:white;padding:7px;min-height:39px}.subtle{font-size:13px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:13px 0}.metric{background:#f2f5f8;border-radius:9px;padding:10px}.metric b{display:block;font-size:20px}.metric small{color:var(--muted);font-size:12px}.note{background:var(--blue-soft);border-radius:10px;padding:12px;font-size:13px;margin-top:12px}.segment{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 8px}.segment button{flex:1;text-align:left;min-width:180px}.segment small{display:block;font-size:12px;opacity:.85}.plan{padding:11px 13px;border-radius:10px;background:#f2f5f8;color:#32485c;font-size:13px;margin:11px 0 17px}.section-title{font-size:19px;margin:24px 0 11px}.section-title small{font-size:12px;color:var(--muted);font-weight:400;margin-left:7px}.card{border:1px solid var(--line);border-radius:13px;background:white;padding:17px 18px;margin:10px 0 15px;overflow-wrap:anywhere}.card.is-done{border-left:5px solid var(--green)}.card.is-retry{border-left:5px solid var(--amber)}.card-header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.card-number{font-weight:750;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:7px}.kind{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:4px 8px;background:var(--blue-soft);color:var(--blue)}.kind.rev{background:#f1f0f7;color:#59497f}.kind.retry{background:var(--amber-soft);color:var(--amber)}.cat{font-size:12px;color:var(--muted);margin-left:auto}.intent{font-size:20px;font-weight:750;line-height:1.4;margin:5px 0 12px;letter-spacing:-.01em}.fixed{font-size:13px;padding:8px 10px;margin:8px 0 12px;border-radius:9px;background:var(--blue-soft)}.fixed strong{color:var(--blue)}.exercise{padding:12px 0;border-top:1px solid #edf0f3}.exercise-label{font-size:12px;font-weight:700;color:#445d72;letter-spacing:.02em}.jp{font-size:16px;font-weight:650;margin:5px 0 7px}.english{font-size:17px;line-height:1.65;margin:5px 0 0}.english[hidden]{display:none}.answer-toggle{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #9daebd;color:var(--blue);border-radius:8px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;margin:0 0 9px}.answer-toggle:hover{background:var(--blue-soft)}.english mark{background:#e5f0fa;color:#0c4065;border-radius:4px;font-weight:700;padding:1px 2px}.eng-note{color:var(--muted);font-size:12px;margin:5px 0}/* The two ratings are a single native radio group, so both can never be checked. */
.action-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:13px;padding:14px 0 0;border:0;border-top:1px solid var(--line);min-width:0}
.action-row legend{font-size:12px;font-weight:650;color:var(--muted);padding:0 4px 0 0}
.choice{display:inline-flex;align-items:center;gap:7px;border:1px solid #c5d1dc;border-radius:8px;padding:8px 12px;background:#fff;color:var(--ink);min-width:108px;font-size:14px;font-weight:600;cursor:pointer}
.choice input{appearance:auto;width:17px;height:17px;margin:0;accent-color:var(--green);cursor:pointer;flex:none}
.choice.no input{accent-color:var(--amber)}
.choice.yes.checked{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.choice.no.checked{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.daily-time{width:100%;border-collapse:collapse;margin:14px 0 12px;font-size:13px}
.daily-time caption{text-align:left;font-size:16px;font-weight:750;margin-bottom:8px}
.daily-time th,.daily-time td{padding:8px 10px;border:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.daily-time th:first-child,.daily-time td:first-child{text-align:left}
.daily-time thead th{background:#f2f5f8}
.daily-time tfoot td{font-weight:750;background:#edf4fa}
.footer-actions{display:flex;gap:8px;justify-content:flex-end;margin:20px 0}.footer-actions button{background:var(--blue);border:1px solid var(--blue);color:white;border-radius:10px;padding:10px 15px}.footer-actions button:disabled{opacity:.5}.empty{border:1px dashed #c9d3dd;border-radius:12px;padding:22px;background:white;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:560px){.container{padding:17px 12px 45px}.panel{padding:14px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:8px}.metric b{font-size:17px}.card{padding:14px}.intent{font-size:19px}.jp{font-size:15px}.english{font-size:16px}.segment button{min-width:130px;padding:9px 10px}}
</style>
</head>
<body><main class="container"><div class="eyebrow">WORKPLACE ENGLISH · SPACED REPETITION</div><h1>Software Engineer Active English</h1>

<script>const PRACTICE=[{"id":1,"category":"要件確認","intent":"聞いた内容を確認","chunk":"Just to confirm,","example":"Just to confirm, this change doesn't affect the frontend, right?","alternate":"Just to confirm, we don’t need to change the database schema, right?","prompt":"フロントエンドに影響しないことの確認","alternate_prompt":"DBスキーマの変更が不要なことの確認","fixed":"Just to confirm,"},{"id":2,"category":"要件確認","intent":"自分の理解を言い換えて確認","chunk":"So, if I understand correctly,","example":"So, if I understand correctly, the API should return an empty list when there are no results.","alternate":"So, if I understand correctly, duplicate values are allowed in the input.","prompt":"検索結果がないときはAPIが空リストを返す、という理解の確認","alternate_prompt":"入力データの重複が許される、という理解の確認","fixed":"So, if I understand correctly,"},{"id":3,"category":"要件確認","intent":"言葉の意味を確認","chunk":"What exactly do you mean by ...?","example":"What exactly do you mean by “complete”? Does that include regression testing?","alternate":"What exactly do you mean by “real time” for this feature?","prompt":"「完了」の意味と、リグレッションテストを含むか確認","alternate_prompt":"この機能での「リアルタイム」の意味を質問","fixed":"What exactly do you mean by"},{"id":4,"category":"要件確認","intent":"追加で質問する","chunk":"Can I check one thing?","example":"Can I check one thing? Which environment should I use to reproduce the issue?","alternate":"Can I check one thing? Is this requirement limited to existing users?","prompt":"障害を再現するために使う環境を質問","alternate_prompt":"要件の対象が既存ユーザーだけか質問","fixed":"Can I check one thing?"},{"id":5,"category":"要件確認","intent":"前に聞いた話を確認","chunk":"Earlier, you mentioned ...","example":"Earlier, you mentioned that the API contract might change. Has that been confirmed?","alternate":"Earlier, you mentioned that the client requested CSV export. Is that still required?","prompt":"APIの契約仕様が変更される可能性について、確定したか確認","alternate_prompt":"以前話に出たCSV出力の要望が今も必要か確認","fixed":"Earlier, you mentioned"},{"id":6,"category":"要件確認","intent":"詳しい説明を求める","chunk":"Could you clarify ...?","example":"Could you clarify how we should handle expired tokens?","alternate":"Could you clarify the expected behavior when the request times out?","prompt":"期限切れトークンの扱いについて説明を依頼","alternate_prompt":"リクエストがタイムアウトしたときの期待動作を質問","fixed":"Could you clarify"},{"id":7,"category":"要件確認","intent":"理解できない部分を聞き直す","chunk":"I’m not sure I follow.","example":"I’m not sure I follow. Are we changing the request format or only the response?","alternate":"I’m not sure I follow. Could you walk me through that part again?","prompt":"変更対象がリクエスト形式かレスポンスだけか確認","alternate_prompt":"分からなかった部分を順を追って再説明してもらう","fixed":"I’m not sure I follow."},{"id":8,"category":"要件確認","intent":"前提を伝える","chunk":"I’m assuming that ...","example":"I’m assuming that the input has already been validated by the time it reaches the service layer.","alternate":"I’m assuming that the endpoint will only be used internally.","prompt":"サービス層に届く前に入力検証が済んでいるという前提","alternate_prompt":"エンドポイントの利用は社内限定という前提","fixed":"I’m assuming that"},{"id":9,"category":"設計・判断","intent":"考えられる方法を提案","chunk":"One possible approach is to ...","example":"One possible approach is to move the validation logic to the service layer.","alternate":"One possible approach is to cache the lookup results for a short period.","prompt":"検証ロジックをサービス層に移す案","alternate_prompt":"検索結果を短時間キャッシュする案","fixed":"One possible approach is to"},{"id":10,"category":"設計・判断","intent":"理由を説明","chunk":"The reason is that ...","example":"The reason is that the controller should focus on handling HTTP requests.","alternate":"The reason is that we need the same validation rule in multiple endpoints.","prompt":"コントローラーはHTTPリクエスト処理に集中すべきという理由","alternate_prompt":"同じ検証ルールを複数のエンドポイントで使うという理由","fixed":"The reason is that"},{"id":11,"category":"設計・判断","intent":"利点を説明","chunk":"The advantage is that ...","example":"The advantage is that we can reuse the logic across multiple APIs.","alternate":"The advantage is that this keeps the implementation simple.","prompt":"複数のAPIでロジックを再利用できる利点","alternate_prompt":"実装をシンプルに保てる利点","fixed":"The advantage is that"},{"id":12,"category":"設計・判断","intent":"欠点を説明","chunk":"The downside is that ...","example":"The downside is that this approach uses more memory.","alternate":"The downside is that it adds an extra database query.","prompt":"メモリ使用量が増えるという欠点","alternate_prompt":"DBへの問い合わせが1回増えるという欠点","fixed":"The downside is that"},{"id":13,"category":"設計・判断","intent":"トレードオフを説明","chunk":"The trade-off here is ...","example":"The trade-off here is development speed versus long-term maintainability.","alternate":"The trade-off here is lower latency versus stronger consistency.","prompt":"開発速度と長期的な保守性のトレードオフ","alternate_prompt":"低遅延と高い整合性のトレードオフ","fixed":"The trade-off here is"},{"id":14,"category":"設計・判断","intent":"懸念を伝える","chunk":"My concern with that approach is ...","example":"My concern with that approach is the impact on existing API clients.","alternate":"My concern with that approach is that it may make testing harder.","prompt":"既存APIクライアントへの影響を懸念","alternate_prompt":"テストが難しくなる可能性を懸念","fixed":"My concern with that approach is"},{"id":15,"category":"設計・判断","intent":"別の方法を提案","chunk":"I’d propose an alternative where ...","example":"I’d propose an alternative where we validate the data before writing it to the database.","alternate":"I’d propose an alternative where we update only the affected records.","prompt":"DBへの書き込み前にデータを検証する代案","alternate_prompt":"影響を受けるレコードだけを更新する代案","fixed":"I’d propose an alternative where"},{"id":16,"category":"設計・判断","intent":"リスクを早めに共有","chunk":"I’d like to flag a risk early.","example":"I’d like to flag a risk early. We depend on an external API that we don’t control.","alternate":"I’d like to flag a risk early. The migration may take longer than expected.","prompt":"制御できない外部APIへの依存というリスク","alternate_prompt":"データ移行に想定以上の時間がかかるリスク","fixed":"I’d like to flag a risk early."},{"id":17,"category":"設計・判断","intent":"前提の検証を提案","chunk":"We need to validate the assumption that ...","example":"We need to validate the assumption that most requests will be reads.","alternate":"We need to validate the assumption that duplicate requests are rare.","prompt":"リクエストの大半が読み取りという前提の検証","alternate_prompt":"重複リクエストはまれという前提の検証","fixed":"We need to validate the assumption that"},{"id":18,"category":"障害・調査","intent":"調査の第一歩を提案","chunk":"Let’s start by ...","example":"Let’s start by reproducing the issue in the test environment.","alternate":"Let’s start by checking the request logs.","prompt":"まずテスト環境で事象を再現する提案","alternate_prompt":"まずリクエストログを確認する提案","fixed":"Let’s start by"},{"id":19,"category":"障害・調査","intent":"考えられる原因を挙げる","chunk":"One possible cause is ...","example":"One possible cause is a timeout between the API and the database.","alternate":"One possible cause is an expired authentication token.","prompt":"APIとDB間のタイムアウトという原因候補","alternate_prompt":"認証トークンの期限切れという原因候補","fixed":"One possible cause is"},{"id":20,"category":"障害・調査","intent":"調査方法の効果を説明","chunk":"Checking the logs helps us ...","example":"Checking the logs helps us narrow down the possible causes.","alternate":"Checking the logs helps us see exactly where the request failed.","prompt":"ログを見れば原因候補を絞れることを説明","alternate_prompt":"ログを見ればリクエストの失敗箇所が正確に分かることを説明","fixed":"Checking the logs helps us"},{"id":21,"category":"障害・調査","intent":"想定外の動作を報告","chunk":"This isn’t working as expected.","example":"This isn’t working as expected. The API returns 200 even when validation fails.","alternate":"This isn’t working as expected in the staging environment.","prompt":"検証失敗時にもAPIがHTTP 200を返す問題","alternate_prompt":"ステージング環境で想定どおりに動かない問題","fixed":"This isn’t working as expected"},{"id":22,"category":"障害・調査","intent":"影響の確認を提案","chunk":"We need to assess the impact.","example":"We need to assess the impact before deploying the fix.","alternate":"We need to assess the impact on related endpoints.","prompt":"修正をデプロイする前の影響評価が必要","alternate_prompt":"関連エンドポイントへの影響評価が必要","fixed":"We need to assess the impact"},{"id":23,"category":"障害・調査","intent":"暫定対応を提案","chunk":"As a temporary workaround, ...","example":"As a temporary workaround, we can disable the scheduled job.","alternate":"As a temporary workaround, we can retry the request manually.","prompt":"一時的に定期実行ジョブを無効にする案","alternate_prompt":"一時的にリクエストを手動で再試行する案","fixed":"As a temporary workaround,"},{"id":24,"category":"障害・調査","intent":"切り戻しの可能性を伝える","chunk":"We may need to roll back ...","example":"We may need to roll back the latest deployment if the error rate keeps rising.","alternate":"We may need to roll back the change to restore the service.","prompt":"エラー率の上昇が続けば直近のデプロイを切り戻す必要","alternate_prompt":"サービス復旧のために変更を切り戻す必要","fixed":"We may need to roll back"},{"id":25,"category":"進捗・協業","intent":"現在の担当作業を伝える","chunk":"I’m currently working on ...","example":"I’m currently working on the authentication API.","alternate":"I’m currently working on the database migration task.","prompt":"現在、認証APIの作業をしていると報告","alternate_prompt":"現在、DB移行タスクに取り組んでいると報告","fixed":"I’m currently working on"},{"id":26,"category":"進捗・協業","intent":"完了した作業と残作業を伝える","chunk":"I’ve finished ... but I still need to ...","example":"I’ve finished the implementation, but I still need to run the integration tests.","alternate":"I’ve finished the API changes, but I still need to update the documentation.","prompt":"実装は完了、結合テストは未実施と報告","alternate_prompt":"API変更は完了、ドキュメント更新は未実施と報告","fixed":"I’ve finished"},{"id":27,"category":"進捗・協業","intent":"予定より時間がかかることを伝える","chunk":"This is taking longer than expected.","example":"This is taking longer than expected because the current behavior is not documented.","alternate":"This is taking longer than expected, so I may need another day.","prompt":"現行動作の資料がなく、想定以上に時間がかかっている","alternate_prompt":"想定以上に時間がかかり、あと1日必要かもしれない","fixed":"This is taking longer than expected"},{"id":28,"category":"進捗・協業","intent":"作業が止まっている理由を伝える","chunk":"I’m blocked by ...","example":"I’m blocked by the missing API specification.","alternate":"I’m blocked by the test environment being unavailable.","prompt":"API仕様書がないため作業を進められない","alternate_prompt":"テスト環境が使えないため作業を進められない","fixed":"I’m blocked by"},{"id":29,"category":"進捗・協業","intent":"調べてから返答する","chunk":"Let me get back to you on that.","example":"Let me get back to you on that after I check the logs.","alternate":"Let me get back to you on that after I review the implementation.","prompt":"ログを確認してから返答することを伝える","alternate_prompt":"実装内容を確認してから返答することを伝える","fixed":"Let me get back to you on that"},{"id":30,"category":"進捗・協業","intent":"レビューを依頼する","chunk":"Could you take a look at ...?","example":"Could you take a look at this pull request when you have a moment?","alternate":"Could you take a look at the error-handling logic?","prompt":"時間のあるときにPRを確認してもらう","alternate_prompt":"エラー処理のロジックを確認してもらう","fixed":"Could you take a look at"},{"id":31,"category":"進捗・協業","intent":"一緒に確認するよう頼む","chunk":"Can we go over ... together?","example":"Can we go over the API design together before I start coding?","alternate":"Can we go over the acceptance criteria together?","prompt":"実装前にAPI設計を一緒に確認する依頼","alternate_prompt":"受け入れ条件を一緒に確認する依頼","fixed":"Can we go over"},{"id":32,"category":"進捗・協業","intent":"自分が対応できると伝える","chunk":"I can take care of that.","example":"I can take care of the unit tests this afternoon.","alternate":"I can take care of updating the documentation.","prompt":"午後の単体テストを自分が引き受ける提案","alternate_prompt":"ドキュメント更新を自分が引き受ける提案","fixed":"I can take care of"},{"id":33,"category":"テスト・レビュー","intent":"テストで確認済みか尋ねる","chunk":"Have we covered ...?","example":"Have we covered the main edge cases in the unit tests?","alternate":"Have we covered the retry scenario in integration testing?","prompt":"主なエッジケースが単体テストで網羅されているか確認","alternate_prompt":"再試行のケースが結合テストで網羅されているか確認","fixed":"Have we covered"},{"id":34,"category":"テスト・レビュー","intent":"受け入れ条件の定義を提案","chunk":"We should define the acceptance criteria first.","example":"We should define the acceptance criteria before estimating the effort.","alternate":"We should define the acceptance criteria before implementation.","prompt":"工数見積もりの前に受け入れ条件を定義する提案","alternate_prompt":"実装開始前に受け入れ条件を定義する提案","fixed":"We should define the acceptance criteria"},{"id":35,"category":"テスト・レビュー","intent":"説明を順番に求める","chunk":"Can you walk me through ...?","example":"Can you walk me through why this condition was added?","alternate":"Can you walk me through how this error is handled?","prompt":"この条件を追加した理由の説明を依頼","alternate_prompt":"エラー処理の流れの説明を依頼","fixed":"Can you walk me through"},{"id":36,"category":"テスト・レビュー","intent":"改善案をやわらかく提案","chunk":"Would it make sense to ...?","example":"Would it make sense to extract this logic into a separate method?","alternate":"Would it make sense to add a test for an empty response?","prompt":"ロジックを別メソッドに切り出す案","alternate_prompt":"空レスポンスのテストを追加する案","fixed":"Would it make sense to"},{"id":37,"category":"説明・修復","intent":"言いたいことを説明し直す","chunk":"What I mean is ...","example":"What I mean is that we should validate the request before calling the service.","alternate":"What I mean is that we should confirm the expected behavior before changing the code.","prompt":"サービス呼び出し前にリクエストを検証すべきという意図","alternate_prompt":"コード変更前に期待動作を確認すべきという意図","fixed":"What I mean is"},{"id":38,"category":"説明・修復","intent":"相手の誤解を訂正する","chunk":"That’s not quite what I meant.","example":"That’s not quite what I meant. I was referring to the response, not the request.","alternate":"That’s not quite what I meant. I was referring to the service, not the controller.","prompt":"指していたのはリクエストでなくレスポンスだと訂正","alternate_prompt":"指していたのはコントローラーでなくサービスだと訂正","fixed":"That’s not quite what I meant."},{"id":39,"category":"説明・修復","intent":"元の質問に戻る","chunk":"Coming back to your question, ...","example":"Coming back to your question, I’d choose the simpler solution.","alternate":"Coming back to your question, I’d investigate the logs first.","prompt":"元の質問に戻り、よりシンプルな解決策を選ぶと回答","alternate_prompt":"元の質問に戻り、まずログを調べると回答","fixed":"Coming back to your question,"},{"id":40,"ca (()=>{
'use strict';
const $=id=>document.getElementById(id);
const all=PRACTICE;
const REVIEW_OFFSETS=[1,3,7,14,30],MAX_DAY=42;
const STORAGE='se-active-english-spaced-v1', DAY_STORAGE=STORAGE+'-selected-day',SESSION_STORAGE=STORAGE+'-selected-session';
let marks={},day=1,session='a';

try{const m=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(m&&typeof m==='object'&&!Array.isArray(m))marks=m;}catch(e){}

try{session=localStorage.getItem(SESSION_STORAGE)==='b'?'b':'a'}catch(e){}

const startedOn=id=>Math.floor((id-1)/4)+1;
const fresh=d=>all.filter(x=>startedOn(x.id)===d);
function latestResult(id,beforeDay){let state='',when=0;for(let t=1;t<beforeDay;t++){let v=marks[`${t}:${id}`];if((v==='done'||v==='retry')&&t>when){when=t;state=v;}}return state;}
function expected(d){
  const newItems=fresh(d);
  const due=all.filter(x=>REVIEW_OFFSETS.some(offset=>startedOn(x.id)+offset===d));
  const retries=all.filter(x=>startedOn(x.id)<d&&!due.some(v=>v.id===x.id)&&!newItems.some(v=>v.id===x.id)&&latestResult(x.id,d)==='retry');
  // On scheduled gaps, practice a few previously introduced cards as a light reinforcement.
  let optional=[];
  if(!newItems.length&&!due.length&&!retries.length){const pool=all.filter(x=>startedOn(x.id)<d);if(pool.length){const offset=((d*5)%pool.length);optional=Array.from({length:Math.min(4,pool.length)},(_,i)=>pool[(offset+i*7)%pool.length]);}}
  return {newItems,due,retries,optional};
}
function getSessions(d){const e=expected(d);const halves={a:[],b:[]};
  // Keep each group in the original numeric order: first half in A, remainder in B.
  // Do not alternate odd/even IDs. Split review and new work separately to balance time.
  const reviewed=[...e.retries.map(x=>({item:x,kind:'retry'})),...e.due.map(x=>({item:x,kind:'review'})),...e.optional.map(x=>({item:x,kind:'free'}))].sort((a,b)=>a.item.id-b.item.id);
  const newWork=e.newItems.map(x=>({item:x,kind:'new'})).sort((a,b)=>a.item.id-b.item.id);
  for(const group of [reviewed,newWork]){
    const midpoint=Math.ceil(group.length/2);
    halves.a.push(...group.slice(0,midpoint));
    halves.b.push(...group.slice(midpoint));
  }
  return {e,halves};
}
function highlighted(en,fixed){const text=String(en),frag=String(fixed);const pos=text.toLowerCase().indexOf(frag.toLowerCase());
  return pos<0?esc(text):esc(text.slice(0,pos))+'<mark>'+esc(text.slice(pos,pos+frag.length))+'</mark>'+esc(text.slice(pos+frag.length));}
function stateOf(id){return marks[`${day}:${id}`]||'';}
function card(x,kind,scored){const m=scored?stateOf(x.id):'';const visible=revealed.has(`${day}:${x.id}`);
 const k=kind==='new'?'NEW':kind==='review'?'REVIEW':kind==='retry'?'RETRY':kind==='free'?'FREE PRACTICE':'PRACTICE';
 const cls=kind==='review'?'rev':kind==='retry'?'retry':'';
 return `<article class="card ${m==='done'?'is-done':m==='retry'?'is-retry':''}" data-card="${x.id}">

  <div class="exercise"><div class="exercise-label">② 同じ表現で内容を変える</div><div class="jp">${esc(x.alternate_prompt)}</div><div class="english" lang="en" ${visible?'':'hidden'}>${highlighted(x.alternate,x.fixed)}</div></div>
  ${scored?`<fieldset class="action-row"><legend>#${x.id} 発話結果（どちらか一方）</legend><label class="choice yes ${m==='done'?'checked':''}"><input type="radio" name="rating-${day}-${x.id}" value="done" data-grade-id="${x.id}" ${m==='done'?'checked':''}><span>言えた</span></label><label class="choice no ${m==='retry'?'checked':''}"><input type="radio" name="rating-${day}-${x.id}" value="retry" data-grade-id="${x.id}" ${m==='retry'?'checked':''}><span>言えなかった</span></label></fieldset>`:''}
  </article>`}
function timeBudget(half,first){
  const warm=first?2:1;
  const newCount=half.filter(x=>x.kind==='new').length;
  const reviewCount=half.length-newCount;
  const count=half.length;
  const improv=count===0?15-warm:count>=8?2:count>=4?3:5;
  const available=15-warm-improv;
  const freshM=newCount===0?0:reviewCount===0?available:Math.round(available*(2.5*newCount)/(2.5*newCount+reviewCount));
  return {warm,newM:freshM,reviewM:available-freshM,improv};
}
function timeTable(halves){
  const a=timeBudget(halves.a,true),b=timeBudget(halves.b,false);
  const lines=[['① ウォームアップ',a.warm,b.warm],['② 復習',a.reviewM,b.reviewM],['③ 新規',a.newM,b.newM],['④ 即興・言い換え',a.improv,b.improv]];

  return `<table class="daily-time"><caption>今日の30分配分</caption><thead><tr><th>内容</th><th>前半</th><th>後半</th><th>合計</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>合計</td><td>15分</td><td>15分</td><td>30分</td></tr></tfoot></table>`;

function renderSchedule(){const {e,halves}=getSessions(day),tasks=halves[session];const total=halves.a.length+halves.b.length,graded=[...halves.a,...halves.b].filter(({item})=>['done','retry'].includes(stateOf(item.id))).length;const done=[...halves.a,...halves.b].filter(({item})=>stateOf(item.id)==='done').length;
 $('schedulePanel').innerHTML=`<div class="panel"><div class="row space"><div><div class="eyebrow">DAY PLAN · ${day} / ${MAX_DAY}</div><div class="daytitle">Day ${day}</div></div><div class="subtle">日付による自動進行なし・前回の選択を保存</div></div>
 <div class="day-nav"><button type="button" data-nav="prev" ${day===1?'disabled':''}>← 前の日</button><label for="daySelect">日を選ぶ</label><select id="daySelect">${Array.from({length:MAX_DAY},(_,i)=>`<option value="${i+1}" ${day===i+1?'selected':''}>Day ${i+1}</option>`).join('')}</select><button type="button" data-nav="next" ${day===MAX_DAY?'disabled':''}>次の日 →</button></div>
 <div class="metrics"><div class="metric"><b>${e.newItems.length}</b><small>今日の新規</small></div><div class="metric"><b>${e.due.length+e.retries.length}</b><small>定期復習＋再挑戦</small></div><div class="metric"><b>${graded}/${total}</b><small>判定済（言えた ${done}）</small></div></div>
 <div class="note"><b>基本は1日30分＝前半15分＋後半15分。</b>一度に30分取れない日は分けて練習できます。学習日のDayは自動では進みません。各Dayの復習量に応じて時間を再配分します。目安の時間なので、発話の難しさに合わせて調整して構いません。</div>${timeTable(halves)}</div>
 <div class="segment"><button type="button" class="${session==='a'?'active':''}" data-session="a" aria-pressed="${session==='a'}">前半 · 15分<small>${halves.a.length}文</small></button><button type="button" class="${session==='b'?'active':''}" data-session="b" aria-pressed="${session==='b'}">後半 · 15分<small>${halves.b.length}文</small></button></div>
 <div class="plan">${session==='a'?'前半':'後半'}の手順：①日本語の意味を確認 → ②<b>青い共通フレーズ</b>を使って①②を英語で言う → 英文を表示して確認 → ③できれば自分の業務でもう1文 → ④「言えた」「言えなかった」を記録。<br><span class="subtle">言えなかった文は次のDayの復習に追加。文法の小さなミスより、伝えたい意味が出たかで判定。</span></div>
 <h2 class="section-title">${session==='a'?'前半':'後半'}の練習 <small>${tasks.length}文・目安15分</small></h2>${tasks.length?tasks.map(({item,kind})=>card(item,kind,true)).join(''):'<div class="empty">この回には予定された英文がありません。自分の仕事の出来事を今日のchunkで1〜2分説明する練習に使ってください。</div>'}
 <div class="footer-actions"><button type="button" data-jump="${session==='a'?'b':'a'}">${session==='a'?'後半の練習へ →':'← 前半へ戻る'}</button></div>
 <div class="panel subtle">復習の初期設定：初回から<strong>1・3・7・14・30学習日後</strong>。エビングハウスの研究を参考にした間隔反復の一例で、万人共通の最適日程ではありません。詰まった文は次の学習日に再挑戦します。学習を休む日はDayを進めなくて構いません。</div>`;}
function draw(){renderSchedule();}
function setDay(d){const n=Number(d);if(!Number.isInteger(n)||n<1||n>MAX_DAY)return;day=n;session='a';persist();draw();}

 if(e.target.id==='daySelect'){setDay(e.target.value);return;}

 const {halves}=getSessions(day),items=[...halves.a,...halves.b];

 const done=items.filter(({item})=>stateOf(item.id)==='done').length;

$('schedulePanel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
