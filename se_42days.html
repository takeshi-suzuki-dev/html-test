<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Engineer Active English | 実務英文・間隔反復</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--paper:#fff;--ink:#182938;--muted:#5f7180;--line:#dce3ea;--blue:#17476b;--blue-soft:#edf4fa;--green:#1c6848;--green-soft:#eaf6ee;--amber:#955a14;--amber-soft:#fff5e6}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;margin:0}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #7ca9cc;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
.container{max-width:950px;margin:0 auto;padding:22px 18px 72px}.eyebrow{font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--blue)}h1{font-size:clamp(24px,4vw,32px);line-height:1.2;letter-spacing:-.03em;margin:5px 0 9px}.segment button,.day-nav button{border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:white;color:var(--ink)}.segment button.active{background:var(--blue);color:white;border-color:var(--blue)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.space{justify-content:space-between}.daytitle{font-size:23px;font-weight:750}.day-nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0}.day-nav label{font-size:13px;font-weight:650}.day-nav select{border:1px solid #c3ccd5;border-radius:8px;background:white;padding:7px;min-height:39px}.subtle{font-size:13px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:13px 0}.metric{background:#f2f5f8;border-radius:9px;padding:10px}.metric b{display:block;font-size:20px}.metric small{color:var(--muted);font-size:12px}.note{background:var(--blue-soft);border-radius:10px;padding:12px;font-size:13px;margin-top:12px}.segment{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 8px}.segment button{flex:1;text-align:left;min-width:180px}.segment small{display:block;font-size:12px;opacity:.85}.plan{padding:11px 13px;border-radius:10px;background:#f2f5f8;color:#32485c;font-size:13px;margin:11px 0 17px}.section-title{font-size:19px;margin:24px 0 11px}.section-title small{font-size:12px;color:var(--muted);font-weight:400;margin-left:7px}.card{border:1px solid var(--line);border-radius:13px;background:white;padding:17px 18px;margin:10px 0 15px;overflow-wrap:anywhere}.card.is-done{border-left:5px solid var(--green)}.card.is-retry{border-left:5px solid var(--amber)}.card-header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.card-number{font-weight:750;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:7px}.kind{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:4px 8px;background:var(--blue-soft);color:var(--blue)}.kind.rev{background:#f1f0f7;color:#59497f}.kind.retry{background:var(--amber-soft);color:var(--amber)}.cat{font-size:12px;color:var(--muted);margin-left:auto}.intent{font-size:20px;font-weight:750;line-height:1.4;margin:5px 0 12px;letter-spacing:-.01em}.fixed{font-size:13px;padding:8px 10px;margin:8px 0 12px;border-radius:9px;background:var(--blue-soft)}.fixed strong{color:var(--blue)}.exercise{padding:12px 0;border-top:1px solid #edf0f3}.exercise-label{font-size:12px;font-weight:700;color:#445d72;letter-spacing:.02em}.jp{font-size:16px;font-weight:650;margin:5px 0 7px}.english{font-size:17px;line-height:1.65;margin:5px 0 0}.english mark{background:#e5f0fa;color:#0c4065;border-radius:4px;font-weight:700;padding:1px 2px}.eng-note{color:var(--muted);font-size:12px;margin:5px 0}/* The two ratings are a single native radio group, so both can never be checked. */
.action-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:13px;padding:14px 0 0;border:0;border-top:1px solid var(--line);min-width:0}
.action-row legend{font-size:12px;font-weight:650;color:var(--muted);padding:0 4px 0 0}
.choice{display:inline-flex;align-items:center;gap:7px;border:1px solid #c5d1dc;border-radius:8px;padding:8px 12px;background:#fff;color:var(--ink);min-width:108px;font-size:14px;font-weight:600;cursor:pointer}
.choice input{appearance:auto;width:17px;height:17px;margin:0;accent-color:var(--green);cursor:pointer;flex:none}
.choice.no input{accent-color:var(--amber)}
.choice.yes.checked{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.choice.no.checked{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.daily-time{width:100%;border-collapse:collapse;margin:14px 0 12px;font-size:13px}
.daily-time caption{text-align:left;font-size:16px;font-weight:750;margin-bottom:8px}
.daily-time th,.daily-time td{padding:8px 10px;border:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.daily-time th:first-child,.daily-time td:first-child{text-align:left}
.daily-time thead th{background:#f2f5f8}
.daily-time tfoot td{font-weight:750;background:#edf4fa}
.status{font-size:12px;color:var(--muted)}.status.success{color:var(--green);font-weight:700}.status.warn{color:var(--amber);font-weight:700}.footer-actions{display:flex;gap:8px;justify-content:flex-end;margin:20px 0}.footer-actions button{background:var(--blue);border:1px solid var(--blue);color:white;border-radius:10px;padding:10px 15px}.footer-actions button:disabled{opacity:.5}.empty{border:1px dashed #c9d3dd;border-radius:12px;padding:22px;background:white;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:560px){.container{padding:17px 12px 45px}.panel{padding:14px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:8px}.metric b{font-size:17px}.card{padding:14px}.intent{font-size:19px}.jp{font-size:15px}.english{font-size:16px}.segment button{min-width:130px;padding:9px 10px}}
</style>
</head>
<body><main class="container"><div class="eyebrow">WORKPLACE ENGLISH · SPACED REPETITION</div><h1>Software Engineer Active English</h1>

<section id="schedulePanel" aria-label="今日のスケジュール"></section>
</main>
<script>const PRACTICE=[{"id":1,"category":"要件確認","intent":"変更の影響を確認","chunk":"Just to confirm,","example":"Just to confirm, this change doesn't affect the frontend, right?","alternate":"Just to confirm, we don’t need to change the database schema, right?","prompt":"念のため確認ですが、この変更はフロントエンドには影響しませんよね？","alternate_prompt":"念のため確認ですが、データベースのスキーマを変更する必要はないですよね？","fixed":"Just to confirm,"},{"id":2,"category":"要件確認","intent":"相手の依頼を言い換える","chunk":"So, if I understand correctly,","example":"So, if I understand correctly, the API should return an empty list when there are no results.","alternate":"So, if I understand correctly, duplicate values are allowed in the input.","prompt":"つまり、私の理解が正しければ、検索結果がないときAPIは空のリストを返すべき、ということですね。","alternate_prompt":"つまり、私の理解が正しければ、入力には重複した値が含まれていてもよい、ということですね。","fixed":"So, if I understand correctly,"},{"id":3,"category":"要件確認","intent":"用語の意味を確認","chunk":"What exactly do you mean by ...?","example":"What exactly do you mean by “complete”? Does that include regression testing?","alternate":"What exactly do you mean by “real time” for this feature?","prompt":"「完了」とは具体的にどういう意味ですか？リグレッションテストも含みますか？","alternate_prompt":"この機能でいう「リアルタイム」とは具体的にどういう意味ですか？","fixed":"What exactly do you mean by"},{"id":4,"category":"要件確認","intent":"追加で一つ聞く","chunk":"Can I check one thing?","example":"Can I check one thing? Which environment should I use to reproduce the issue?","alternate":"Can I check one thing? Is this requirement limited to existing users?","prompt":"一つ確認してもいいですか？この問題を再現するには、どの環境を使えばいいですか？","alternate_prompt":"一つ確認してもいいですか？この要件は既存ユーザーだけが対象ですか？","fixed":"Can I check one thing?"},{"id":5,"category":"要件確認","intent":"前の説明に戻る","chunk":"Earlier, you mentioned ...","example":"Earlier, you mentioned that the API contract might change. Has that been confirmed?","alternate":"Earlier, you mentioned that the client requested CSV export. Is that still required?","prompt":"先ほどAPIの契約仕様が変わるかもしれないとおっしゃっていましたが、それは確定しましたか？","alternate_prompt":"先ほどクライアントがCSV出力を要望したとおっしゃっていましたが、それは今も必要ですか？","fixed":"Earlier, you mentioned"},{"id":6,"category":"要件確認","intent":"不明点を追加説明してもらう","chunk":"Could you clarify ...?","example":"Could you clarify how we should handle expired tokens?","alternate":"Could you clarify the expected behavior when the request times out?","prompt":"有効期限が切れたトークンをどう扱うべきか、詳しく教えてもらえますか？","alternate_prompt":"リクエストがタイムアウトした場合、どのような動作が期待されるのか詳しく教えてもらえますか？","fixed":"Could you clarify"},{"id":7,"category":"要件確認","intent":"理解が追いつかない","chunk":"I’m not sure I follow.","example":"I’m not sure I follow. Are we changing the request format or only the response?","alternate":"I’m not sure I follow. Could you walk me through that part again?","prompt":"ちょっと理解が追いついていません。変更するのはリクエスト形式ですか？それともレスポンスだけですか？","alternate_prompt":"ちょっと理解が追いついていません。その部分をもう一度、順を追って説明してもらえますか？","fixed":"I’m not sure I follow."},{"id":8,"category":"要件確認","intent":"仮定を明示","chunk":"I’m assuming that ...","example":"I’m assuming that the input has already been validated by the time it reaches the service layer.","alternate":"I’m assuming that the endpoint will only be used internally.","prompt":"サービス層に到達する時点で、入力の検証はすでに済んでいるという前提で考えています。","alternate_prompt":"このエンドポイントは社内でしか使われないという前提で考えています。","fixed":"I’m assuming that"},{"id":9,"category":"設計・判断","intent":"解決案を一つ提示","chunk":"One possible approach is to ...","example":"One possible approach is to move the validation logic to the service layer.","alternate":"One possible approach is to cache the lookup results for a short period.","prompt":"考えられる方法の一つは、検証ロジックをサービス層へ移すことです。","alternate_prompt":"考えられる方法の一つは、検索結果を短時間キャッシュすることです。","fixed":"One possible approach is to"},{"id":10,"category":"設計・判断","intent":"判断理由","chunk":"The reason is that ...","example":"The reason is that the controller should focus on handling HTTP requests.","alternate":"The reason is that we need the same validation rule in multiple endpoints.","prompt":"理由は、コントローラーはHTTPリクエストの処理に集中すべきだからです。","alternate_prompt":"理由は、同じ検証ルールを複数のエンドポイントで使う必要があるからです。","fixed":"The reason is that"},{"id":11,"category":"設計・判断","intent":"利点を説明","chunk":"The advantage is that ...","example":"The advantage is that we can reuse the logic across multiple APIs.","alternate":"The advantage is that this keeps the implementation simple.","prompt":"利点は、そのロジックを複数のAPIで再利用できることです。","alternate_prompt":"利点は、これによって実装をシンプルに保てることです。","fixed":"The advantage is that"},{"id":12,"category":"設計・判断","intent":"欠点を説明","chunk":"The downside is that ...","example":"The downside is that this approach uses more memory.","alternate":"The downside is that it adds an extra database query.","prompt":"欠点は、この方法だとメモリ使用量が増えることです。","alternate_prompt":"欠点は、データベースへの問い合わせが1回余分に発生することです。","fixed":"The downside is that"},{"id":13,"category":"設計・判断","intent":"比較検討","chunk":"The trade-off here is ...","example":"The trade-off here is development speed versus long-term maintainability.","alternate":"The trade-off here is lower latency versus stronger consistency.","prompt":"ここでのトレードオフは、開発速度と長期的な保守性です。","alternate_prompt":"ここでのトレードオフは、応答時間を短くすることと整合性を強めることです。","fixed":"The trade-off here is"},{"id":14,"category":"設計・判断","intent":"懸念を表明","chunk":"My concern with that approach is ...","example":"My concern with that approach is the impact on existing API clients.","alternate":"My concern with that approach is that it may make testing harder.","prompt":"その方法で懸念しているのは、既存のAPIクライアントへの影響です。","alternate_prompt":"その方法で懸念しているのは、テストが難しくなるかもしれないことです。","fixed":"My concern with that approach is"},{"id":15,"category":"設計・判断","intent":"代案を提示","chunk":"I’d propose an alternative where ...","example":"I’d propose an alternative where we validate the data before writing it to the database.","alternate":"I’d propose an alternative where we update only the affected records.","prompt":"代案として、データベースに書き込む前にデータを検証する方法を提案します。","alternate_prompt":"代案として、影響を受けるレコードだけを更新する方法を提案します。","fixed":"I’d propose an alternative where"},{"id":16,"category":"設計・判断","intent":"リスクを早めに共有","chunk":"I’d like to flag a risk early.","example":"I’d like to flag a risk early. We depend on an external API that we don’t control.","alternate":"I’d like to flag a risk early. The migration may take longer than expected.","prompt":"早い段階でリスクを共有しておきたいです。私たちは制御できない外部APIに依存しています。","alternate_prompt":"早い段階でリスクを共有しておきたいです。移行作業は予想より時間がかかるかもしれません。","fixed":"I’d like to flag a risk early."},{"id":17,"category":"設計・判断","intent":"まず前提を検証","chunk":"We need to validate the assumption that ...","example":"We need to validate the assumption that most requests will be reads.","alternate":"We need to validate the assumption that duplicate requests are rare.","prompt":"リクエストの大半は読み取りである、という前提を検証する必要があります。","alternate_prompt":"重複したリクエストはめったにない、という前提を検証する必要があります。","fixed":"We need to validate the assumption that"},{"id":18,"category":"障害・調査","intent":"最初の調査方法を提案","chunk":"Let’s start by ...","example":"Let’s start by reproducing the issue in the test environment.","alternate":"Let’s start by checking the request logs.","prompt":"まず、この問題をテスト環境で再現することから始めましょう。","alternate_prompt":"まず、リクエストログを確認することから始めましょう。","fixed":"Let’s start by"},{"id":19,"category":"障害・調査","intent":"原因候補を挙げる","chunk":"One possible cause is ...","example":"One possible cause is a timeout between the API and the database.","alternate":"One possible cause is an expired authentication token.","prompt":"考えられる原因の一つは、APIとデータベースの間で起きるタイムアウトです。","alternate_prompt":"考えられる原因の一つは、認証トークンの有効期限切れです。","fixed":"One possible cause is"},{"id":20,"category":"障害・調査","intent":"ログの価値を説明","chunk":"Checking the logs helps us ...","example":"Checking the logs helps us narrow down the possible causes.","alternate":"Checking the logs helps us see exactly where the request failed.","prompt":"ログを確認すると、考えられる原因を絞り込めます。","alternate_prompt":"ログを確認すると、リクエストが正確にどこで失敗したか分かります。","fixed":"Checking the logs helps us"},{"id":21,"category":"障害・調査","intent":"現象が期待と違う","chunk":"This isn’t working as expected.","example":"This isn’t working as expected. The API returns 200 even when validation fails.","alternate":"This isn’t working as expected in the staging environment.","prompt":"想定どおりに動いていません。検証に失敗しても、APIがHTTP 200を返してしまいます。","alternate_prompt":"ステージング環境では、これは想定どおりに動いていません。","fixed":"This isn’t working as expected"},{"id":22,"category":"障害・調査","intent":"影響を調べる","chunk":"We need to assess the impact.","example":"We need to assess the impact before deploying the fix.","alternate":"We need to assess the impact on related endpoints.","prompt":"修正をデプロイする前に、影響を評価する必要があります。","alternate_prompt":"関連するエンドポイントへの影響を評価する必要があります。","fixed":"We need to assess the impact"},{"id":23,"category":"障害・調査","intent":"暫定回避を提案","chunk":"As a temporary workaround, ...","example":"As a temporary workaround, we can disable the scheduled job.","alternate":"As a temporary workaround, we can retry the request manually.","prompt":"暫定的な回避策として、定期実行ジョブを無効にできます。","alternate_prompt":"暫定的な回避策として、リクエストを手動で再試行できます。","fixed":"As a temporary workaround,"},{"id":24,"category":"障害・調査","intent":"切り戻し判断","chunk":"We may need to roll back ...","example":"We may need to roll back the latest deployment if the error rate keeps rising.","alternate":"We may need to roll back the change to restore the service.","prompt":"エラー率が上がり続けるなら、直近のデプロイを切り戻す必要があるかもしれません。","alternate_prompt":"サービスを復旧させるために、その変更を切り戻す必要があるかもしれません。","fixed":"We may need to roll back"},{"id":25,"category":"進捗・協業","intent":"現在の作業を共有","chunk":"I’m currently working on ...","example":"I’m currently working on the authentication API.","alternate":"I’m currently working on the database migration task.","prompt":"現在、認証APIの作業に取り組んでいます。","alternate_prompt":"現在、データベース移行の作業に取り組んでいます。","fixed":"I’m currently working on"},{"id":26,"category":"進捗・協業","intent":"終わった所と残り","chunk":"I’ve finished ... but I still need to ...","example":"I’ve finished the implementation, but I still need to run the integration tests.","alternate":"I’ve finished the API changes, but I still need to update the documentation.","prompt":"実装は終わりましたが、結合テストはまだ実行する必要があります。","alternate_prompt":"APIの変更は終わりましたが、ドキュメントはまだ更新する必要があります。","fixed":"I’ve finished"},{"id":27,"category":"進捗・協業","intent":"想定より時間がかかる","chunk":"This is taking longer than expected.","example":"This is taking longer than expected because the current behavior is not documented.","alternate":"This is taking longer than expected, so I may need another day.","prompt":"今の動作が文書化されていないため、予想以上に時間がかかっています。","alternate_prompt":"予想以上に時間がかかっているので、もう1日必要かもしれません。","fixed":"This is taking longer than expected"},{"id":28,"category":"進捗・協業","intent":"ブロッカーを説明","chunk":"I’m blocked by ...","example":"I’m blocked by the missing API specification.","alternate":"I’m blocked by the test environment being unavailable.","prompt":"APIの仕様書がないことが障害となり、作業を進められません。","alternate_prompt":"テスト環境を使えないことが障害となり、作業を進められません。","fixed":"I’m blocked by"},{"id":29,"category":"進捗・協業","intent":"確認して返答する","chunk":"Let me get back to you on that.","example":"Let me get back to you on that after I check the logs.","alternate":"Let me get back to you on that after I review the implementation.","prompt":"ログを確認してから、この件について回答します。","alternate_prompt":"実装内容を確認してから、この件について回答します。","fixed":"Let me get back to you on that"},{"id":30,"category":"進捗・協業","intent":"レビューを依頼","chunk":"Could you take a look at ...?","example":"Could you take a look at this pull request when you have a moment?","alternate":"Could you take a look at the error-handling logic?","prompt":"お時間のあるときに、このプルリクエストを確認してもらえますか？","alternate_prompt":"エラー処理のロジックを確認してもらえますか？","fixed":"Could you take a look at"},{"id":31,"category":"進捗・協業","intent":"一緒に見てほしい","chunk":"Can we go over ... together?","example":"Can we go over the API design together before I start coding?","alternate":"Can we go over the acceptance criteria together?","prompt":"実装を始める前に、API設計を一緒に確認できますか？","alternate_prompt":"受け入れ条件を一緒に確認できますか？","fixed":"Can we go over"},{"id":32,"category":"進捗・協業","intent":"自分が対応する","chunk":"I can take care of that.","example":"I can take care of the unit tests this afternoon.","alternate":"I can take care of updating the documentation.","prompt":"今日の午後、私が単体テストを担当できます。","alternate_prompt":"ドキュメントの更新は私が担当できます。","fixed":"I can take care of"},{"id":33,"category":"テスト・レビュー","intent":"テスト範囲を確認","chunk":"Have we covered ...?","example":"Have we covered the main edge cases in the unit tests?","alternate":"Have we covered the retry scenario in integration testing?","prompt":"主なエッジケース（通常と異なる条件）は単体テストでカバーできていますか？","alternate_prompt":"再試行のケースは結合テストでカバーできていますか？","fixed":"Have we covered"},{"id":34,"category":"テスト・レビュー","intent":"受け入れ条件を先に決める","chunk":"We should define the acceptance criteria first.","example":"We should define the acceptance criteria before estimating the effort.","alternate":"We should define the acceptance criteria before implementation.","prompt":"工数を見積もる前に、受け入れ条件を定義すべきです。","alternate_prompt":"実装に入る前に、受け入れ条件を定義すべきです。","fixed":"We should define the acceptance criteria"},{"id":35,"category":"テスト・レビュー","intent":"変更理由を聞く","chunk":"Can you walk me through ...?","example":"Can you walk me through why this condition was added?","alternate":"Can you walk me through how this error is handled?","prompt":"なぜこの条件が追加されたのか、順を追って説明してもらえますか？","alternate_prompt":"このエラーがどう処理されるのか、順を追って説明してもらえますか？","fixed":"Can you walk me through"},{"id":36,"category":"テスト・レビュー","intent":"改善案を柔らかく示す","chunk":"Would it make sense to ...?","example":"Would it make sense to extract this logic into a separate method?","alternate":"Would it make sense to add a test for an empty response?","prompt":"このロジックを別のメソッドに切り出すのはどうでしょうか？","alternate_prompt":"空のレスポンスに対するテストを追加するのはどうでしょうか？","fixed":"Would it make sense to"},{"id":37,"category":"説明・修復","intent":"話の中心を言い直す","chunk":"What I mean is ...","example":"What I mean is that we should validate the request before calling the service.","alternate":"What I mean is that we should confirm the expected behavior before changing the code.","prompt":"つまり私が言いたいのは、サービスを呼び出す前にリクエストを検証すべきだということです。","alternate_prompt":"つまり私が言いたいのは、コー (()=>{
'use strict';
const $=id=>document.getElementById(id);
const all=PRACTICE;
const REVIEW_OFFSETS=[1,3,7,14,30],MAX_DAY=42;
const STORAGE='se-active-english-spaced-v1', DAY_STORAGE=STORAGE+'-selected-day',SESSION_STORAGE=STORAGE+'-selected-session';
let marks={},day=1,session='a';
try{const m=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(m&&typeof m==='object'&&!Array.isArray(m))marks=m;}catch(e){}
try{let d=Number(localStorage.getItem(DAY_STORAGE));if(Number.isInteger(d)&&d>=1&&d<=MAX_DAY)day=d;}catch(e){}
try{session=localStorage.getItem(SESSION_STORAGE)==='b'?'b':'a'}catch(e){}
const esc=t=>String(t).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(marks));localStorage.setItem(DAY_STORAGE,String(day));localStorage.setItem(SESSION_STORAGE,session);}catch(e){}}
const startedOn=id=>Math.floor((id-1)/4)+1;
const fresh=d=>all.filter(x=>startedOn(x.id)===d);
function latestResult(id,beforeDay){let state='',when=0;for(let t=1;t<beforeDay;t++){let v=marks[`${t}:${id}`];if((v==='done'||v==='retry')&&t>when){when=t;state=v;}}return state;}
function expected(d){
  const newItems=fresh(d);
  const due=all.filter(x=>REVIEW_OFFSETS.some(offset=>startedOn(x.id)+offset===d));
  const retries=all.filter(x=>startedOn(x.id)<d&&!due.some(v=>v.id===x.id)&&!newItems.some(v=>v.id===x.id)&&latestResult(x.id,d)==='retry');
  // On scheduled gaps, practice a few previously introduced cards as a light reinforcement.
  let optional=[];
  if(!newItems.length&&!due.length&&!retries.length){const pool=all.filter(x=>startedOn(x.id)<d);if(pool.length){const offset=((d*5)%pool.length);optional=Array.from({length:Math.min(4,pool.length)},(_,i)=>pool[(offset+i*7)%pool.length]);}}
  return {newItems,due,retries,optional};
}
function getSessions(d){const e=expected(d);const halves={a:[],b:[]};
  // Review is interleaved with new material; split to keep each sitting short.
  const reviewed=[...e.retries.map(x=>({item:x,kind:'retry'})),...e.due.map(x=>({item:x,kind:'review'})),...e.optional.map(x=>({item:x,kind:'free'}))];
  reviewed.forEach((e,i)=>halves[i%2===0?'a':'b'].push(e));
  e.newItems.forEach((x,i)=>halves[i%2===0?'a':'b'].push({item:x,kind:'new'}));
  return {e,halves};
}
function highlighted(en,fixed){const text=String(en),frag=String(fixed);const pos=text.toLowerCase().indexOf(frag.toLowerCase());
  return pos<0?esc(text):esc(text.slice(0,pos))+'<mark>'+esc(text.slice(pos,pos+frag.length))+'</mark>'+esc(text.slice(pos+frag.length));}
function stateOf(id){return marks[`${day}:${id}`]||'';}
function card(x,kind,scored){const m=scored?stateOf(x.id):'';
 const k=kind==='new'?'NEW':kind==='review'?'REVIEW':kind==='retry'?'RETRY':kind==='free'?'FREE PRACTICE':'PRACTICE';
 const cls=kind==='review'?'rev':kind==='retry'?'retry':'';
 return `<article class="card ${m==='done'?'is-done':m==='retry'?'is-retry':''}" data-card="${x.id}">
  <div class="card-header"><span class="card-number">#${x.id}</span><span class="kind ${cls}">${k}</span><span class="cat">${esc(x.category)}</span></div>
  <h3 class="intent">${esc(x.intent)}</h3>${x.id===45||x.id===46?'<div class="eng-note">※ 面接用の仮想例です。自分の実際の経歴に合わせて言い換えてください。</div>':''}
  <div class="fixed">変えずに使う表現： <strong>${esc(x.fixed)}</strong></div>
  <div class="exercise"><div class="exercise-label">① 日本語で伝えたい内容</div><div class="jp">${esc(x.prompt)}</div><div class="english" lang="en">${highlighted(x.example,x.fixed)}</div></div>
  <div class="exercise"><div class="exercise-label">② 同じ表現で内容を変える</div><div class="jp">${esc(x.alternate_prompt)}</div><div class="english" lang="en">${highlighted(x.alternate,x.fixed)}</div></div>
  ${scored?`<fieldset class="action-row"><legend>#${x.id} 発話結果（どちらか一方）</legend><label class="choice yes ${m==='done'?'checked':''}"><input type="radio" name="rating-${day}-${x.id}" value="done" data-grade-id="${x.id}" ${m==='done'?'checked':''}><span>言えた</span></label><label class="choice no ${m==='retry'?'checked':''}"><input type="radio" name="rating-${day}-${x.id}" value="retry" data-grade-id="${x.id}" ${m==='retry'?'checked':''}><span>言えなかった</span></label><span class="status ${m==='done'?'success':m==='retry'?'warn':''}" aria-live="polite">${m==='done'?'今回の練習は完了':m==='retry'?'翌日の再挑戦に追加':'①②を口に出してから判定'}</span></fieldset>`:''}
  </article>`}
function timeBudget(half,first){
  const warm=first?2:1;
  const newCount=half.filter(x=>x.kind==='new').length;
  const reviewCount=half.length-newCount;
  const count=half.length;
  const improv=count===0?15-warm:count>=8?2:count>=4?3:5;
  const available=15-warm-improv;
  const freshM=newCount===0?0:reviewCount===0?available:Math.round(available*(2.5*newCount)/(2.5*newCount+reviewCount));
  return {warm,newM:freshM,reviewM:available-freshM,improv};
}
function timeTable(halves){
  const a=timeBudget(halves.a,true),b=timeBudget(halves.b,false);
  const lines=[['① ウォームアップ',a.warm,b.warm],['② 復習',a.reviewM,b.reviewM],['③ 新規',a.newM,b.newM],['④ 即興・言い換え',a.improv,b.improv]];
  const rows=lines.map(([label,m,n])=>`<tr><td>${label}</td><td>${m}分</td><td>${n}分</td><td>${m+n}分</td></tr>`).join('');
  return `<table class="daily-time"><caption>今日の30分配分</caption><thead><tr><th>内容</th><th>前半</th><th>後半</th><th>合計</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>合計</td><td>15分</td><td>15分</td><td>30分</td></tr></tfoot></table>`;
}
function renderSchedule(){const {e,halves}=getSessions(day),tasks=halves[session];const total=halves.a.length+halves.b.length,graded=[...halves.a,...halves.b].filter(({item})=>['done','retry'].includes(stateOf(item.id))).length;const done=[...halves.a,...halves.b].filter(({item})=>stateOf(item.id)==='done').length;
 $('schedulePanel').innerHTML=`<div class="panel"><div class="row space"><div><div class="eyebrow">DAY PLAN · ${day} / ${MAX_DAY}</div><div class="daytitle">Day ${day}</div></div><div class="subtle">日付による自動進行なし・前回の選択を保存</div></div>
 <div class="day-nav"><button type="button" data-nav="prev" ${day===1?'disabled':''}>← 前の日</button><label for="daySelect">日を選ぶ</label><select id="daySelect">${Array.from({length:MAX_DAY},(_,i)=>`<option value="${i+1}" ${day===i+1?'selected':''}>Day ${i+1}</option>`).join('')}</select><button type="button" data-nav="next" ${day===MAX_DAY?'disabled':''}>次の日 →</button></div>
 <div class="metrics"><div class="metric"><b>${e.newItems.length}</b><small>今日の新規</small></div><div class="metric"><b>${e.due.length+e.retries.length}</b><small>定期復習＋再挑戦</small></div><div class="metric"><b>${graded}/${total}</b><small>判定済（言えた ${done}）</small></div></div>
 <div class="note"><b>基本は1日30分＝前半15分＋後半15分。</b>一度に30分取れない日は分けて練習できます。学習日のDayは自動では進みません。各Dayの復習量に応じて時間を再配分します。目安の時間なので、発話の難しさに合わせて調整して構いません。</div>${timeTable(halves)}</div>
 <div class="segment"><button type="button" class="${session==='a'?'active':''}" data-session="a" aria-pressed="${session==='a'}">前半 · 15分<small>${halves.a.length}文</small></button><button type="button" class="${session==='b'?'active':''}" data-session="b" aria-pressed="${session==='b'}">後半 · 15分<small>${halves.b.length}文</small></button></div>
 <div class="plan">${session==='a'?'前半':'後半'}の手順：①日本語の意味を確認 → ②<b>青い共通フレーズ</b>を使って①②の英文を声に出す → ③できれば自分の業務でもう1文 → ④「言えた」「言えなかった」を記録。<br><span class="subtle">言えなかった文は次のDayの復習に追加。文法の小さなミスより、伝えたい意味が出たかで判定。</span></div>
 <h2 class="section-title">${session==='a'?'前半':'後半'}の練習 <small>${tasks.length}文・目安15分</small></h2>${tasks.length?tasks.map(({item,kind})=>card(item,kind,true)).join(''):'<div class="empty">この回には予定された英文がありません。自分の仕事の出来事を今日のchunkで1〜2分説明する練習に使ってください。</div>'}
 <div class="footer-actions"><button type="button" data-jump="${session==='a'?'b':'a'}">${session==='a'?'後半の練習へ →':'← 前半へ戻る'}</button></div>
 <div class="panel subtle">復習の初期設定：初回から<strong>1・3・7・14・30学習日後</strong>。エビングハウスの研究を参考にした間隔反復の一例で、万人共通の最適日程ではありません。詰まった文は次の学習日に再挑戦します。学習を休む日はDayを進めなくて構いません。</div>`;}
function draw(){renderSchedule();}
function setDay(d){const n=Number(d);if(!Number.isInteger(n)||n<1||n>MAX_DAY)return;day=n;session='a';persist();draw();}
function setSession(which){session=which;persist();draw();}
$('schedulePanel').addEventListener('change',e=>{
 if(e.target.id==='daySelect'){setDay(e.target.value);return;}
 const input=e.target.closest('input[data-grade-id]');if(!input)return;
 const id=input.dataset.gradeId,choice=input.value;
 marks[`${day}:${id}`]=choice;persist();
 const box=input.closest('.card');if(box){
   box.classList.toggle('is-done',choice==='done');box.classList.toggle('is-retry',choice==='retry');
   box.querySelectorAll('.choice').forEach(l=>l.classList.toggle('checked',l.querySelector('input').checked));
   const st=box.querySelector('.status');st.className='status '+(choice==='done'?'success':'warn');st.textContent=choice==='done'?'今回の練習は完了':'翌日の再挑戦に追加';
 }
 const {halves}=getSessions(day),items=[...halves.a,...halves.b];
 const graded=items.filter(({item})=>['done','retry'].includes(stateOf(item.id))).length;
 const done=items.filter(({item})=>stateOf(item.id)==='done').length;
 const m=$('schedulePanel').querySelector('.metrics .metric:last-child');if(m)m.innerHTML=`<b>${graded}/${items.length}</b><small>判定済（言えた ${done}）</small>`;
});
$('schedulePanel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.session)setSession(b.dataset.session);
 else if(b.dataset.jump)setSession(b.dataset.jump);
 else if(b.dataset.nav)setDay(day+(b.dataset.nav==='next'?1:-1));
});
renderSchedule();
})();</script></body></html>
