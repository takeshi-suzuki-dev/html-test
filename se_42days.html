<script>const PRACTICE=[{"id":1,"category":"要件確認","intent":"影響範囲を確認","chunk":"Just to confirm,","example":"Just to confirm, this change only affects the backend, right?","alternate":"Just to confirm, we don’t need to change the database schema, right?","prompt":"変更対象がバックエンドだけなのか確認する","alternate_prompt":"DBのスキーマ変更は必要ない、という理解を確認する","fixed":"Just to confirm,"},{"id":2,"category":"要件確認","intent":"相手の依頼を言い換える","chunk":"So, if I understand correctly,","example":"So, if I understand correctly, the API should return an empty list when there are no results.","alternate":"So, if I understand correctly, duplicate values are allowed in the input.","prompt":"検索結果が0件ならAPIは空リストを返す、という理解を伝える","alternate_prompt":"入力には重複した値を含めてもよい、という理解を伝える","fixed":"So, if I understand correctly,"},{"id":3,"category":"要件確認","intent":"用語の意味を確認","chunk":"What exactly do you mean by ...?","example":"What exactly do you mean by “complete”? Does that include regression testing?","alternate":"What exactly do you mean by “real time” for this feature?","prompt":"「完了」にリグレッションテストも含まれるか確認する","alternate_prompt":"この機能における「リアルタイム」の意味を確認する","fixed":"What exactly do you mean by"},{"id":4,"category":"要件確認","intent":"追加で一つ聞く","chunk":"Can I check one thing?","example":"Can I check one thing? Which environment should I use to reproduce the issue?","alternate":"Can I check one thing? Is this requirement limited to existing users?","prompt":"障害の再現にはどの環境を使うべきか聞く","alternate_prompt":"この要件が既存ユーザーに限られるのか聞く","fixed":"Can I check one thing?"},{"id":5,"category":"要件確認","intent":"前の説明に戻る","chunk":"Earlier, you mentioned ...","example":"Earlier, you mentioned that the API contract might change. Has that been confirmed?","alternate":"Earlier, you mentioned that the client requested CSV export. Is that still required?","prompt":"先ほどのAPI仕様変更が確定したか尋ねる","alternate_prompt":"前に話題になったCSV出力がまだ必要かを尋ねる","fixed":"Earlier, you mentioned"},{"id":6,"category":"要件確認","intent":"不明点を追加説明してもらう","chunk":"Could you clarify ...?","example":"Could you clarify how we should handle expired tokens?","alternate":"Could you clarify the expected behavior when the request times out?","prompt":"期限切れトークンをどう扱うべきか詳しく聞く","alternate_prompt":"リクエストがタイムアウトしたときに期待される動作を聞く","fixed":"Could you clarify"},{"id":7,"category":"要件確認","intent":"理解が追いつかない","chunk":"I’m not sure I follow.","example":"I’m not sure I follow. Are we changing the request format or only the response?","alternate":"I’m not sure I follow. Could you walk me through that part again?","prompt":"話についていけなかったので、リクエスト形式かレスポンスだけか確認する","alternate_prompt":"話についていけなかったので、その部分をもう一度順序立てて説明してもらう","fixed":"I’m not sure I follow."},{"id":8,"category":"要件確認","intent":"仮定を明示","chunk":"I’m assuming that ...","example":"I’m assuming that the input has already been validated by the time it reaches the service layer.","alternate":"I’m assuming that the endpoint will only be used internally.","prompt":"サービス層に来るまでに入力検証は完了済み、という前提を示す","alternate_prompt":"そのAPIが社内だけで利用されるという前提を示す","fixed":"I’m assuming that"},{"id":9,"category":"設計・判断","intent":"解決案を一つ提示","chunk":"One possible approach is to ...","example":"One possible approach is to move the validation logic to the service layer.","alternate":"One possible approach is to cache the lookup results for a short period.","prompt":"検証ロジックをサービス層へ移す案を出す","alternate_prompt":"検索結果を短時間キャッシュする案を出す","fixed":"One possible approach is to"},{"id":10,"category":"設計・判断","intent":"判断理由","chunk":"The reason is that ...","example":"The reason is that the controller should focus on handling HTTP requests.","alternate":"The reason is that we need the same validation rule in multiple endpoints.","prompt":"コントローラーはHTTPリクエストの処理に集中すべきだと理由を述べる","alternate_prompt":"同じ検証ルールを複数のエンドポイントで使う必要があると理由を述べる","fixed":"The reason is that"},{"id":11,"category":"設計・判断","intent":"利点を説明","chunk":"The advantage is that ...","example":"The advantage is that we can reuse the logic across multiple APIs.","alternate":"The advantage is that this keeps the implementation simple.","prompt":"複数のAPIでロジックを再利用できることを利点として説明する","alternate_prompt":"実装をシンプルに保てることを利点として説明する","fixed":"The advantage is that"},{"id":12,"category":"設計・判断","intent":"欠点を説明","chunk":"The downside is that ...","example":"The downside is that this approach uses more memory.","alternate":"The downside is that it adds an extra database query.","prompt":"メモリ消費量が増えることを欠点として述べる","alternate_prompt":"DBへの問い合わせが1回増えることを欠点として述べる","fixed":"The downside is that"},{"id":13,"category":"設計・判断","intent":"比較検討","chunk":"The trade-off here is ...","example":"The trade-off here is development speed versus long-term maintainability.","alternate":"The trade-off here is lower latency versus stronger consistency.","prompt":"開発速度と長期的な保守性のトレードオフを説明する","alternate_prompt":"応答遅延の低減とより強い整合性のトレードオフを説明する","fixed":"The trade-off here is"},{"id":14,"category":"設計・判断","intent":"懸念を表明","chunk":"My concern with that approach is ...","example":"My concern with that approach is the impact on existing API clients.","alternate":"My concern with that approach is that it may make testing harder.","prompt":"既存のAPIクライアントへの影響が心配だと伝える","alternate_prompt":"テストしにくくなる可能性を懸念として伝える","fixed":"My concern with that approach is"},{"id":15,"category":"設計・判断","intent":"代案を提示","chunk":"I’d propose an alternative where ...","example":"I’d propose an alternative where we validate the data before writing it to the database.","alternate":"I’d propose an alternative where we update only the affected records.","prompt":"DBに書き込む前にデータを検証する代案を提案する","alternate_prompt":"影響のあるレコードだけ更新する代案を提案する","fixed":"I’d propose an alternative where"},{"id":16,"category":"設計・判断","intent":"リスクを早めに共有","chunk":"I’d like to flag a risk early.","example":"I’d like to flag a risk early. We depend on an external API that we don’t control.","alternate":"I’d like to flag a risk early. The migration may take longer than expected.","prompt":"自分たちで制御できない外部APIへの依存リスクを早めに伝える","alternate_prompt":"データ移行に予想以上の時間がかかるリスクを早めに伝える","fixed":"I’d like to flag a risk early."},{"id":17,"category":"設計・判断","intent":"まず前提を検証","chunk":"We need to validate the assumption that ...","example":"We need to validate the assumption that most requests will be reads.","alternate":"We need to validate the assumption that duplicate requests are rare.","prompt":"リクエストの大半が読み取り処理、という前提を検証すべきだと述べる","alternate_prompt":"重複リクエストはまれ、という前提を検証すべきだと述べる","fixed":"We need to validate the assumption that"},{"id":18,"category":"障害・調査","intent":"まず再現する","chunk":"Let’s start by ...","example":"Let’s start by reproducing the issue in the test environment.","alternate":"Let’s start by checking the request logs.","prompt":"まずテスト環境でその不具合を再現しようと提案する","alternate_prompt":"まずリクエストログを確認しようと提案する","fixed":"Let’s start by"},{"id":19,"category":"障害・調査","intent":"原因候補を挙げる","chunk":"One possible cause is ...","example":"One possible cause is a timeout between the API and the database.","alternate":"One possible cause is an expired authentication token.","prompt":"APIとDB間のタイムアウトを原因候補として挙げる","alternate_prompt":"期限切れの認証トークンを原因候補として挙げる","fixed":"One possible cause is"},{"id":20,"category":"障害・調査","intent":"ログの価値を説明","chunk":"Checking the logs helps us ...","example":"Checking the logs helps us narrow down the possible causes.","alternate":"Checking the logs helps us see exactly where the request failed.","prompt":"ログを確認すると原因候補を絞り込めると説明する","alternate_prompt":"ログを調べるとリクエストが失敗した場所を特定できると説明する","fixed":"Checking the logs helps us"},{"id":21,"category":"障害・調査","intent":"現象が期待と違う","chunk":"This isn’t working as expected.","example":"This isn’t working as expected. The API returns 200 even when validation fails.","alternate":"This isn’t working as expected in the staging environment.","prompt":"検証失敗時もAPIがHTTP 200を返しており、想定どおりに動いていないと説明する","alternate_prompt":"ステージング環境で想定どおりに動作していないと説明する","fixed":"This isn’t working as expected"},{"id":22,"category":"障害・調査","intent":"影響を調べる","chunk":"We need to assess the impact.","example":"We need to assess the impact before deploying the fix.","alternate":"We need to assess the impact on related endpoints.","prompt":"修正をデプロイする前に影響を評価すべきだと述べる","alternate_prompt":"関連するエンドポイントへの影響を評価すべきだと述べる","fixed":"We need to assess the impact"},{"id":23,"category":"障害・調査","intent":"暫定回避を提案","chunk":"As a temporary workaround, ...","example":"As a temporary workaround, we can disable the scheduled job.","alternate":"As a temporary workaround, we can retry the request manually.","prompt":"一時的な回避策として定期実行ジョブを無効化する案を示す","alternate_prompt":"一時的に手動でリクエストを再試行する案を示す","fixed":"As a temporary workaround,"},{"id":24,"category":"障害・調査","intent":"切り戻し判断","chunk":"We may need to roll back ...","example":"We may need to roll back the latest deployment if the error rate keeps rising.","alternate":"We may need to roll back the change to restore the service.","prompt":"エラー率が上がり続けるなら最新デプロイを切り戻す必要があると述べる","alternate_prompt":"サービス復旧のため変更を切り戻す必要があるかもしれないと述べる","fixed":"We may need to roll back"},{"id":25,"category":"進捗・協業","intent":"現在の担当を伝える","chunk":"I’m currently working on ...","example":"I’m currently working on the authentication API.","alternate":"I’m currently working on the database migration task.","prompt":"今は認証APIを担当していると報告する","alternate_prompt":"今はDB移行タスクを担当していると報告する","fixed":"I’m currently working on"},{"id":26,"category":"進捗・協業","intent":"終わった所と残り","chunk":"I’ve finished ... but I still need to ...","example":"I’ve finished the implementation, but I still need to run the integration tests.","alternate":"I’ve finished the API changes, but I still need to update the documentation.","prompt":"実装は完了したが、結合テストが残っていると報告する","alternate_prompt":"API変更は完了したが、ドキュメント更新が残っていると報告する","fixed":"I’ve finished"},{"id":27,"category":"進捗・協業","intent":"想定より時間がかかる","chunk":"This is taking longer than expected.","example":"This is taking longer than expected because the current behavior is not documented.","alternate":"This is taking longer than expected, so I may need another day.","prompt":"現行の動作が文書化されていないため、想定より時間がかかっていると説明する","alternate_prompt":"想定より時間がかかっており、もう1日必要かもしれないと説明する", る","fixed":"Have we covered"},{"id":34,"category":"テスト・レビュー","intent":"受け入れ条件を先に決める","chunk":"We should define the acceptance criteria first.","example":"We should define the acceptance criteria before estimating the effort.","alternate":"We should define the acceptance criteria before implementation.","prompt":"工数を見積もる前に受け入れ条件を定義すべきだと提案する","alternate_prompt":"実装前に受け入れ条件を定義すべきだと提案する","fixed":"We should define the acceptance criteria"},{"id":35,"category":"テスト・レビュー","intent":"変更理由を聞く","chunk":"Can you walk me through ...?","example":"Can you walk me through why this condition was added?","alternate":"Can you walk me through how this error is handled?","prompt":"コードレビューで、その条件を追加した理由を説明してもらう","alternate_prompt":"このエラーがどのように処理されるのか説明してもらう","fixed":"Can you walk me through"},{"id":36,"category":"テスト・レビュー","intent":"改善案を柔らかく示す","chunk":"Would it make sense to ...?","example":"Would it make sense to extract this logic into a separate method?","alternate":"Would it make sense to add a test for an empty response?","prompt":"この処理を別メソッドに切り出すのはどうかと柔らかく提案する","alternate_prompt":"空レスポンスのテストを追加するのはどうかと提案する","fixed":"Would it make sense to"},{"id":37,"category":"説明・修復","intent":"話の中心を言い直す","chunk":"What I mean is ...","example":"What I mean is that we should validate the request before calling the service.","alternate":"What I mean is that I use examples from my job to practise English.","prompt":"サービス呼び出しの前にリクエストを検証すべき、という真意を伝える","alternate_prompt":"英語学習では実際の仕事の例を使って練習する、という真意を伝える","fixed":"What I mean is"},{"id":38,"category":"説明・修復","intent":"誤解をはっきり訂正","chunk":"That’s not quite what I meant.","example":"That’s not quite what I meant. I was referring to the response, not the request.","alternate":"That’s not quite what I meant. I was referring to the service, not the controller.","prompt":"リクエストではなくレスポンスの話だと相手の誤解を訂正する","alternate_prompt":"コントローラーではなくサービスについて話していたと誤解を訂正する","fixed":"That’s not quite what I meant."},{"id":39,"category":"説明・修復","intent":"論点に戻る","chunk":"Coming back t (()=>{
'use strict';
const $=id=>document.getElementById(id);
const all=PRACTICE;
const REVIEW_OFFSETS=[1,3,7,14,30],MAX_DAY=42;
const STORAGE='se-active-english-spaced-v1', DAY_STORAGE=STORAGE+'-selected-day',SESSION_STORAGE=STORAGE+'-selected-session';
let marks={},day=1,session='a',view='schedule',category='',search='';
try{const m=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(m&&typeof m==='object'&&!Array.isArray(m))marks=m;}catch(e){}
try{let d=Number(localStorage.getItem(DAY_STORAGE));if(Number.isInteger(d)&&d>=1&&d<=MAX_DAY)day=d;}catch(e){}
try{session=localStorage.getItem(SESSION_STORAGE)==='b'?'b':'a'}catch(e){}
const esc=t=>String(t).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(marks));localStorage.setItem(DAY_STORAGE,String(day));localStorage.setItem(SESSION_STORAGE,session);}catch(e){}}
const startedOn=id=>Math.floor((id-1)/4)+1;
const fresh=d=>all.filter(x=>startedOn(x.id)===d);
function latestResult(id,beforeDay){let state='',when=0;for(let t=1;t<beforeDay;t++){let v=marks[`${t}:${id}`];if((v==='done'||v==='retry')&&t>when){when=t;state=v;}}return state;}
function expected(d){
  const newItems=fresh(d);
  const due=all.filter(x=>REVIEW_OFFSETS.some(offset=>startedOn(x.id)+offset===d));
  const retries=all.filter(x=>startedOn(x.id)<d&&!due.some(v=>v.id===x.id)&&!newItems.some(v=>v.id===x.id)&&latestResult(x.id,d)==='retry');
  // On scheduled gaps, practice a few previously introduced cards as a light reinforcement.
  let optional=[];
  if(!newItems.length&&!due.length&&!retries.length){const pool=all.filter(x=>startedOn(x.id)<d);if(pool.length){const offset=((d*5)%pool.length);optional=Array.from({length:Math.min(4,pool.length)},(_,i)=>pool[(offset+i*7)%pool.length]);}}
  return {newItems,due,retries,optional};
}
function getSessions(d){const e=expected(d);const halves={a:[],b:[]};
  // Review is interleaved with new material; split to keep each sitting short.
  const reviewed=[...e.retries.map(x=>({item:x,kind:'retry'})),...e.due.map(x=>({item:x,kind:'review'})),...e.optional.map(x=>({item:x,kind:'free'}))];
  reviewed.forEach((e,i)=>halves[i%2===0?'a':'b'].push(e));
  e.newItems.forEach((x,i)=>halves[i%2===0?'a':'b'].push({item:x,kind:'new'}));
  return {e,halves};
}
function highlighted(en,fixed){const text=String(en),frag=String(fixed);const pos=text.toLowerCase().indexOf(frag.toLowerCase());
  return pos<0?esc(text):esc(text.slice(0,pos))+'<mark>'+esc(text.slice(pos,pos+frag.length))+'</mark>'+esc(text.slice(pos+frag.length));}
function stateOf(id){return marks[`${day}:${id}`]||'';}
function card(x,kind,scored){const m=scored?stateOf(x.id):'';
 const k=kind==='new'?'NEW':kind==='review'?'REVIEW':kind==='retry'?'RETRY':kind==='free'?'FREE PRACTICE':'WORK SENTENCE';
 const cls=kind==='review'?'rev':kind==='retry'?'retry':'';
 return `<article class="card ${m==='done'?'is-done':m==='retry'?'is-retry':''}" data-card="${x.id}">
  <div class="card-header"><span class="card-number">#${x.id}</span><span class="kind ${cls}">${k}</span><span class="cat">${esc(x.category)}</span></div>
  <h3 class="intent">${esc(x.intent)}</h3>
  <div class="fixed">変えずに使う表現： <strong>${esc(x.fixed)}</strong></div>
  <div class="exercise"><div class="exercise-label">場面 ①</div><div class="jp">${esc(x.prompt)}</div><div class="english" lang="en">${highlighted(x.example,x.fixed)}</div></div>
  <div class="exercise"><div class="exercise-label">場面 ② — 後ろの内容を変える</div><div class="jp">${esc(x.alternate_prompt)}</div><div class="english" lang="en">${highlighted(x.alternate,x.fixed)}</div></div>
  ${scored?`<div class="action-row" role="group" aria-label="#${x.id}の発話結果"><button type="button" class="yes ${m==='done'?'active':''}" aria-pressed="${m==='done'}" data-act="done" data-id="${x.id}">${m==='done'?'✓ 言えた':'言えた'}</button><button type="button" class="no ${m==='retry'?'active':''}" aria-pressed="${m==='retry'}" data-act="retry" data-id="${x.id}">${m==='retry'?'↻ 言えなかった':'言えなかった'}</button><span class="status ${m==='done'?'success':m==='retry'?'warn':''}" aria-live="polite">${m==='done'?'今回の練習は完了':m==='retry'?'翌日の再挑戦に追加':'①②を口に出してから判定'}</span></div>`:''}
  </article>`}
function renderSchedule(){const {e,halves}=getSessions(day),tasks=halves[session];const total=halves.a.length+halves.b.length,graded=[...halves.a,...halves.b].filter(({item})=>['done','retry'].includes(stateOf(item.id))).length;const done=[...halves.a,...halves.b].filter(({item})=>stateOf(item.id)==='done').length;
 $('schedulePanel').innerHTML=`<div class="panel"><div class="row space"><div><div class="eyebrow">DAY PLAN · ${day} / ${MAX_DAY}</div><div class="daytitle">Day ${day}</div></div><div class="subtle">日付による自動進行なし・前回の選択を保存</div></div>
 <div class="day-nav"><button type="button" data-nav="prev" ${day===1?'disabled':''}>← 前の日</button><label for="daySelect">日を選ぶ</label><select id="daySelect">${Array.from({length:MAX_DAY},(_,i)=>`<option value="${i+1}" ${day===i+1?'selected':''}>Day ${i+1}</option>`).join('')}</select><button type="button" data-nav="next" ${day===MAX_DAY?'disabled':''}>次の日 →</button></div>
 <div class="metrics"><div class="metric"><b>${e.newItems.length}</b><small>今日の新規</small></div><div class="metric"><b>${e.due.length+e.retries.length}</b><small>定期復習＋再挑戦</small></div><div class="metric"><b>${graded}/${total}</b><small>判定済（言えた ${done}）</small></div></div>
 <div class="note"><b>1回10〜15分 × 1〜2回</b>：前半・後半に分けて練習します。両方やれば1日約20〜30分。1回しかできない日は、次回このDayの後半から再開すればOK。両方済ませてから次のDayへ進みます。<br>各回の目安：ウォームアップ2分 → ①②を発話8〜10分 → 自分の仕事に変えて話す2分 → 判定1分。</div></div>
 <div class="segment"><button type="button" class="${session==='a'?'active':''}" data-session="a" aria-pressed="${session==='a'}">前半 · 10〜15分<small>${halves.a.length}文</small></button><button type="button" class="${session==='b'?'active':''}" data-session="b" aria-pressed="${session==='b'}">後半 · 10〜15分<small>${halves.b.length}文</small></button></div>
 <div class="plan">${session==='a'?'前半':'後半'}の手順：①仕事の状況を読む → ②<b>青い共通フレーズ</b>を残して本文を変えながら2文を発話 → ③自分の仕事でもう1文 → ④「言えた」か「言えなかった」を記録。<br><span class="subtle">言えなかった文は次のDayの復習に追加。文法の小さなミスより、伝えたい意味が出たかで判定。</span></div>
 <h2 class="section-title">${session==='a'?'前半':'後半'}の練習 <small>${tasks.length}文・目安10〜15分</small></h2>${tasks.length?tasks.map(({item,kind})=>card(item,kind,true)).join(''):'<div class="empty">この回には予定された英文がありません。自分の仕事の出来事を今日のchunkで1〜2分説明する練習に使ってください。</div>'}
 <div class="footer-actions"><button type="button" data-jump="${session==='a'?'b':'a'}">${session==='a'?'後半の練習へ →':'← 前半へ戻る'}</button></div>
 <div class="panel subtle">復習の初期設定：初回から<strong>1・3・7・14・30学習日後</strong>。エビングハウスの研究を参考にした間隔反復の一例で、万人共通の最適日程ではありません。詰まった文は次の学習日に再挑戦します。学習を休む日はDayを進めなくて構いません。</div>`;}
function renderList(){const list=all.filter(x=>(!category||x.category===category)&&(!search||[x.category,x.intent,x.prompt,x.alternate_prompt,x.chunk,x.example,x.alternate].join(' ').toLowerCase().includes(search.toLowerCase())));$('resultCount').textContent=`${list.length} / ${all.length} 文`;$('listResults').innerHTML=list.length?list.map(x=>card(x,'',false)).join(''):'<div class="empty">該当する表現がありません。</div>';}
function draw(){if(view==='schedule')renderSchedule();else renderList();}
function setDay(d){const n=Number(d);if(!Number.isInteger(n)||n<1||n>MAX_DAY)return;day=n;session='a';persist();draw();}
function setSession(which){session=which;persist();draw();}
$('schedulePanel').addEventListener('change',e=>{if(e.target.id==='daySelect')setDay(e.target.value);});
$('schedulePanel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.session)setSession(b.dataset.session);
 else if(b.dataset.jump)setSession(b.dataset.jump);
 else if(b.dataset.nav)setDay(day+(b.dataset.nav==='next'?1:-1));
 else if(b.dataset.act){const k=`${day}:${b.dataset.id}`;marks[k]=b.dataset.act==='done'?'done':'retry';persist();
 // Update status without rebuilding the entire card: avoid losing the user's scroll position.
 const box=b.closest('.card');if(box){const state=marks[k],isDone=state==='done';box.classList.toggle('is-done',isDone);box.classList.toggle('is-retry',!isDone);const yes=box.querySelector('.yes'),no=box.querySelector('.no'),status=box.querySelector('.status');yes.classList.toggle('active',isDone);yes.setAttribute('aria-pressed',String(isDone));yes.textContent=isDone?'✓ 言えた':'言えた';no.classList.toggle('active',!isDone);no.setAttribute('aria-pressed',String(!isDone));no.textContent=!isDone?'↻ 言えなかった':'言えなかった';status.className='status '+(isDone?'success':'warn');status.textContent=isDone?'今回の練習は完了':'翌日の再挑戦に追加';}
 // Only re-render the numerical counters, retaining scroll and focus.
 const {halves}=getSessions(day),items=[...halves.a,...halves.b],graded=items.filter(({item})=>['done','retry'].includes(stateOf(item.id))).length,done=items.filter(({item})=>stateOf(item.id)==='done').length;
 const m=$('schedulePanel').querySelector('.metrics .metric:last-child');if(m)m.innerHTML=`<b>${graded}/${items.length}</b><small>判定済（言えた ${done}）</small>`;
 }
});
$('scheduleTab').onclick=()=>{view='schedule';$('schedulePanel').hidden=false;$('listPanel').hidden=true;$('scheduleTab').classList.add('active');$('listTab').classList.remove('active');$('scheduleTab').setAttribute('aria-selected','true');$('listTab').setAttribute('aria-selected','false');renderSchedule();};
$('listTab').onclick=()=>{view='list';$('schedulePanel').hidden=true;$('listPanel').hidden=false;$('listTab').classList.add('active');$('scheduleTab').classList.remove('active');$('listTab').setAttribute('aria-selected','true');$('scheduleTab').setAttribute('aria-selected','false');renderList();};
for(const c of [...new Set(all.map(x=>x.category))]){let o=document.createElement('option');o.value=c;o.textContent=c;$('category').appendChild(o);}
$('category').onchange=e=>{category=e.target.value;renderList()};$('search').oninput=e=>{search=e.target.value;renderList()};
renderSchedule();
})();</script></body></html>
